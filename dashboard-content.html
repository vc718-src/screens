<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynamic Smart Dashboard</title>
    <style>
        :root {
            --bg1: #0b1220; --bg2: #111827;
            --panel: #1e293b; --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc; --text-sub: #94a3b8;
            --accent-cyan: #38bdf8; --accent-amber: #f59e0b;
            --alert-red: #ef4444; --alert-yellow: #facc15; --alert-green: #4ade80;
        }

        body.night-mode {
            --bg1: #000000; --bg2: #050505; --panel: #0f0f0f;
            --text-main: #d97706; --text-sub: #92400e;
            --accent-cyan: #d97706; --accent-amber: #b45309;
            filter: brightness(0.7);
        }

        body {
            margin: 0; padding: 0; box-sizing: border-box;
            background: linear-gradient(160deg, var(--bg1), var(--bg2));
            color: var(--text-main); font-family: -apple-system, sans-serif;
            overflow: hidden; transition: all 1s ease;
        }

        .app { height: 100vh; padding: 15px; box-sizing: border-box; display: grid; grid-template-rows: 65px 1fr 130px; gap: 15px; }
        .main-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 15px; min-height: 0; }
        .side-column { display: grid; grid-template-rows: auto 1fr; gap: 15px; }
        .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px; padding: 20px 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; flex-direction: column; justify-content: center; }
        
        /* NEW STRICT GRID HEADER */
        .topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; padding: 0 25px; white-space: nowrap; overflow: hidden; }
        
        .time-group { display: flex; align-items: baseline; gap: 15px; }
        #live-time { font-size: 40px; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
        #live-date { font-size: 20px; color: var(--text-sub); font-weight: 500; }
        
        .status-group { display: flex; align-items: center; gap: 18px; font-size: 22px; font-weight: 600; justify-content: flex-end; }
        
        /* WARNING BADGE UPDATES */
        .warning-container { display: none; background: rgba(239, 68, 68, 0.2); border-radius: 8px; padding: 6px 15px; border: 1px solid rgba(239, 68, 68, 0.4); }
        .warning-badge { display: inline-block; color: var(--alert-red); font-size: 22px; font-weight: 700; white-space: nowrap;}
        
        /* HIDE TEMP WHEN WARNING IS ACTIVE */
        .hide-on-alert { display: flex; align-items: center; gap: 18px; }

        .marquee { animation: scroll 12s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(10%); } 100% { transform: translateX(-100%); } }

        .weather-panel { justify-content: space-between; padding: 35px; }
        .weather-now { display: flex; align-items: center; gap: 30px; flex: 1; }
        .w-icon-big { font-size: 120px; font-family: "Apple Color Emoji", sans-serif; line-height: 1; }
        .w-current-temp { font-size: 90px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
        .w-details { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
        .w-desc { font-size: 28px; font-weight: 600; color: var(--accent-cyan); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
        .w-minmax { font-size: 20px; color: var(--text-sub); }

        .hourly-row { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 25px; border-top: 1px solid var(--panel-border); }
        .hour-card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .h-time { font-size: 18px; color: var(--text-sub); font-weight: 500;}
        .h-icon { font-size: 40px; font-family: "Apple Color Emoji", sans-serif; margin: 5px 0; }
        .h-temp { font-size: 24px; font-weight: 700; }

        .anim-sun { display: inline-block; animation: spin 15s linear infinite; }
        .anim-cloud { display: inline-block; animation: float 4s ease-in-out infinite; }
        .anim-rain { display: inline-block; animation: shake 2s ease-in-out infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

        .panel-title { display: flex; justify-content: space-between; align-items: center; font-size: 18px; text-transform: uppercase; color: var(--text-sub); font-weight: 700; margin-bottom: 15px; }
        .bus-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(0,0,0,0.2); border-radius: 12px; border-left: 4px solid var(--text-sub); margin-bottom: 12px;}
        .bus-item.next { border-left-color: var(--accent-cyan); background: rgba(56, 189, 248, 0.05); }
        .bus-time { font-size: 20px; font-weight: 600; }
        .bus-min { font-size: 26px; font-weight: 800; color: var(--accent-cyan); }
        .bus-item.urgent .bus-min { color: var(--alert-red); }

        .quote-panel { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; flex: 1; }
        #quote-text { font-size: 28px; line-height: 1.6; font-weight: 500; font-family: "Microsoft JhengHei", sans-serif; letter-spacing: 2px; }
        #quote-author { font-size: 18px; color: var(--text-sub); margin-top: 15px; }

        .forecast-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; padding: 15px; }
        .day-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
        .d-name { display: flex; flex-direction: row; align-items: baseline; gap: 8px; }
        .d-weekday { font-size: 18px; color: var(--text-main); font-weight: 700; }
        .d-date { font-size: 15px; color: var(--text-sub); font-weight: 500;}
        .d-icon { font-size: 35px; font-family: "Apple Color Emoji", sans-serif; }
        .d-temp { font-size: 18px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="app">
        <header class="panel topbar">
            <div class="time-group">
                <div id="live-time">00:00</div>
                <div id="live-date">Loading...</div>
            </div>
            <div></div> <!-- Flexible spacer column -->
            <div class="status-group">
                <div class="warning-container" id="warning-container">
                    <div class="warning-badge" id="warning-badge">⚠️ Warning</div>
                </div>
                <div class="hide-on-alert" id="normal-weather-header">
                    <div style="color: var(--accent-amber);" id="header-temp">--°C</div>
                    <div style="color: var(--accent-cyan);" id="header-hum">--%</div>
                </div>
            </div>
        </header>

        <main class="main-grid">
            <section class="panel weather-panel">
                <div class="weather-now">
                    <div class="w-icon-big" id="w-main-icon">⛅</div>
                    <div class="w-current-temp" id="w-main-temp">--°</div>
                    <div class="w-details">
                        <div class="w-desc" id="w-main-desc">Loading...</div>
                        <div class="w-minmax" id="w-main-minmax">--° / --°</div>
                        <div class="w-minmax" id="w-uv">UV: --</div>
                    </div>
                </div>
                <div class="hourly-row" id="hourly-container"></div>
            </section>

            <aside class="side-column">
                <section class="panel">
                    <div class="panel-title">🚍 <span id="bus-header">215X</span></div>
                    <div id="kmb-data"><div class="bus-item"><span class="bus-time">Loading...</span></div></div>
                </section>
                <section class="panel quote-panel">
                    <div id="quote-text">載入中...</div>
                    <div id="quote-author">-</div>
                </section>
            </aside>
        </main>
        <footer class="panel forecast-strip" id="forecast-strip"></footer>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('live-time').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('live-date').innerText = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }
        setInterval(updateClock, 1000); updateClock();

        function getHkoEmojiAnim(iconNum, isNight = false) {
            const num = parseInt(iconNum);
            if (num >= 50 && num <= 54) return isNight ? '<span class="anim-sun">🌙</span>' : '<span class="anim-sun">☀️</span>';
            if (num >= 60 && num <= 61) return isNight ? '<span class="anim-cloud">☁️</span>' : '<span class="anim-cloud">⛅</span>';
            if (num >= 62 && num <= 65) return '<span class="anim-rain">🌧️</span>'; 
            if (num >= 70 && num <= 77) return '<span class="anim-rain">⛈️</span>'; 
            return '<span class="anim-cloud">☁️</span>';
        }

        const warningPriority = ['WTCSGNL', 'WRAIN', 'WFNTSA', 'WL', 'WTS', 'WHOT', 'WCOLD', 'WMSGNL', 'WFIRE', 'WFROST'];

        // Updated to a more reliable proxy
        const corsProxy = 'https://api.codetabs.com/v1/proxy/?quest=';

        async function fetchWeather() {
            try {
                const resCurrent = await fetch(corsProxy + encodeURIComponent('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en'));
                const wData = await resCurrent.json();
                const ktTemp = wData.temperature.data.find(t => t.place === "Kwun Tong") || wData.temperature.data[0];
                document.getElementById('header-temp').innerText = `${ktTemp.value}°C`;
                document.getElementById('header-hum').innerText = `${wData.humidity.data[0].value}%`;
                document.getElementById('w-main-temp').innerText = `${ktTemp.value}°`;
                document.getElementById('w-uv').innerText = `UV: ${wData.uvindex ? wData.uvindex.data[0].value : '--'}`;

                const resWarn = await fetch(corsProxy + encodeURIComponent('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=en'));
                const warnData = await resWarn.json();
                const wContainer = document.getElementById('warning-container');
                const wBadge = document.getElementById('warning-badge');
                const normalWeatherHeader = document.getElementById('normal-weather-header');
                
                if (warnData && Object.keys(warnData).length > 0) {
                    let highestPriorityCode = null;
                    
                    for (let code of warningPriority) {
                        if (warnData[code]) { highestPriorityCode = code; break; }
                    }
                    
                    if (highestPriorityCode) {
                        const warningName = warnData[highestPriorityCode].name;
                        wBadge.innerText = `⚠️ ${warningName}`;
                        normalWeatherHeader.style.display = 'none';
                        wContainer.style.display = 'block';
                        if (warningName.length > 20) { wBadge.classList.add('marquee'); } 
                        else { wBadge.classList.remove('marquee'); }
                    } else {
                        normalWeatherHeader.style.display = 'flex';
                        wContainer.style.display = 'none';
                    }
                } else { 
                    normalWeatherHeader.style.display = 'flex';
                    wContainer.style.display = 'none'; 
                }

                const resForecast = await fetch(corsProxy + encodeURIComponent('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=en'));
                const fData = await resForecast.json();
                const today = fData.weatherForecast[0];
                document.getElementById('w-main-minmax').innerText = `${today.forecastMintemp.value}° / ${today.forecastMaxtemp.value}°`;
                document.getElementById('w-main-desc').innerText = today.forecastWeather.split('.')[0]; 

                const currentHour = new Date().getHours();
                const isNightNow = currentHour >= 19 || currentHour < 6;
                document.getElementById('w-main-icon').innerHTML = getHkoEmojiAnim(wData.icon[0], isNightNow);

                const strip = document.getElementById('forecast-strip'); strip.innerHTML = '';
                for (let i = 0; i < 7; i++) {
                    const day = fData.weatherForecast[i];
                    const dateStr = day.forecastDate;
                    const fDate = `${parseInt(dateStr.substring(6, 8))}/${parseInt(dateStr.substring(4, 6))}`;
                    strip.innerHTML += `<div class="day-card"><div class="d-name"><span class="d-weekday">${day.week.substring(0,3)}</span><span class="d-date">${fDate}</span></div><div class="d-icon">${getHkoEmojiAnim(day.ForecastIcon, false)}</div><div class="d-temp">${day.forecastMintemp.value}° - ${day.forecastMaxtemp.value}°</div></div>`;
                }

                const hourlyCont = document.getElementById('hourly-container'); hourlyCont.innerHTML = '';
                for (let i = 1; i <= 5; i++) {
                    let displayHour = (currentHour + (i * 2)) % 24; 
                    let ampm = displayHour >= 12 ? 'PM' : 'AM';
                    let h12 = displayHour % 12 || 12;
                    let isHourNight = displayHour >= 19 || displayHour < 6;
                    hourlyCont.innerHTML += `<div class="hour-card"><div class="h-time">${i===5?'TMRW':h12+' '+ampm}</div><div class="h-icon">${getHkoEmojiAnim(wData.icon[0], isHourNight)}</div><div class="h-temp">${ktTemp.value + (displayHour > 8 && displayHour < 16 ? 1 : -1)}°</div></div>`;
                }
            } catch (e) {
                console.error("Weather API Error: ", e);
            }
        }

        async function fetchKMB() {
            try {
                const response = await fetch(corsProxy + encodeURIComponent(`https://data.etabus.gov.hk/v1/transport/kmb/eta/215D99B3E2A5F8DD/215X/1`));
                const result = await response.json();
                const container = document.getElementById('kmb-data'); container.innerHTML = '';
                if (result.data) {
                    let validBuses = result.data.filter(b => b.eta && b.dir === 'O').sort((a, b) => new Date(a.eta) - new Date(b.eta));
                    let count = 0; let seen = new Set();
                    for (let bus of validBuses) {
                        if (count >= 2) break; 
                        let diff = Math.max(0, Math.round((new Date(bus.eta) - new Date()) / 60000));
                        if (seen.has(diff)) continue; seen.add(diff);
                        let cls = count === 0 ? 'next' : ''; if (diff <= 2) cls += ' urgent';
                        container.innerHTML += `<div class="bus-item ${cls}"><span class="bus-time">${new Date(bus.eta).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'})}</span><span class="bus-min">${diff <= 2 ? 'Arr' : diff+'m'}</span></div>`;
                        count++;
                    }
                }
            } catch (e) {
                console.error("KMB API Error: ", e);
            }
        }

        async function fetchQuote() {
            try {
                const response = await fetch(corsProxy + encodeURIComponent('https://v1.hitokoto.cn/?c=i&c=d&c=k'), { headers: { 'Accept': 'application/json' }});
                const data = await response.json();
                document.getElementById('quote-text').innerText = `「${data.hitokoto}」`;
                document.getElementById('quote-author').innerText = `- ${data.from_who || data.from || "佚名"}`;
            } catch (e) {
                console.error("Quote API Error: ", e);
            }
        }

        fetchWeather(); fetchKMB(); fetchQuote(); 
        setInterval(fetchWeather, 300000); setInterval(fetchKMB, 30000); setInterval(fetchQuote, 3600000);
    </script>
    
</body>
</html>
